name: Deploy ACCHR Backend to Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy ACCHR backend to Contabo
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src,package.json,package-lock.json,server.js,ecosystem.config.js"
          target: "/var/www/ACCHR/Backend"
          overwrite: true

      - name: Restart ACCHR backend with PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd /var/www/ACCHR/Backend

            echo "======================================"
            echo "Deploying ACCHR Backend"
            echo "======================================"

            echo "Node:"
            node -v

            echo "NPM:"
            npm -v

            echo "PM2:"
            pm2 -v || true

            echo "Installing production dependencies..."
            npm ci --omit=dev

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 not found. Installing..."
              npm install -g pm2
            fi

            echo "Checking environment..."

            if [ ! -f .env ]; then
              echo "ERROR: .env file not found!"
              exit 1
            fi

            echo ".env found."

            echo "Starting/restarting ACCHR backend..."

            if pm2 describe golden-asia-ACCHR-Backend >/dev/null 2>&1; then
              pm2 restart golden-asia-ACCHR-Backend --update-env
            else
              pm2 start server.js \
                --name golden-asia-ACCHR-Backend \
                --time
            fi

            pm2 save

            echo "======================================"
            echo "PM2 Status"
            echo "======================================"

            pm2 status

            echo "======================================"
            echo "Port 8000"
            echo "======================================"

            ss -lntp | grep ':8000' || true

            echo "======================================"
            echo "Deployment completed"
            echo "======================================"
